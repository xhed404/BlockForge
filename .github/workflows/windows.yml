name: windows

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install ZLIB (vcpkg)
        shell: pwsh
        run: |
          if (-not $env:VCPKG_INSTALLATION_ROOT) { throw "VCPKG_INSTALLATION_ROOT is not set" }
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install zlib:x64-windows

      - name: Setup JRE 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          java-package: jre
      - name: Capture JRE 8
        shell: pwsh
        run: echo "JRE8=$env:JAVA_HOME" >> $env:GITHUB_ENV

      - name: Setup JRE 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          java-package: jre
      - name: Capture JRE 17
        shell: pwsh
        run: echo "JRE17=$env:JAVA_HOME" >> $env:GITHUB_ENV

      - name: Setup JRE 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          java-package: jre
      - name: Capture JRE 21
        shell: pwsh
        run: echo "JRE21=$env:JAVA_HOME" >> $env:GITHUB_ENV

      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.6.3"
          host: "windows"
          target: "desktop"
          arch: "win64_msvc2019_64"

      - name: Configure
        shell: pwsh
        run: |
          if (-not $env:VCPKG_INSTALLATION_ROOT) { throw "VCPKG_INSTALLATION_ROOT is not set" }
          cmake -S . -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DBLOCKFORGE_BUILD_UI=ON -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows -DVCPKG_APPLOCAL_DEPS=ON

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release

      - name: Package
        shell: pwsh
        run: ./scripts/package_windows.ps1 -BuildDir build -OutDir dist -Version "${{ github.ref_name }}" -Jre8 "$env:JRE8" -Jre17 "$env:JRE17" -Jre21 "$env:JRE21"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BlockForge-windows-${{ github.ref_name }}
          path: dist/**

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/BlockForge-Portable-*.zip
            dist/BlockForge-Setup-*.exe
            dist/SHA256SUMS-*.txt
